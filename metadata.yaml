abstract: "We reproduce the central finding of Dutta et al. (2024), that quantizing a language model can change a large fraction of its individual answers while leaving benchmark accuracy almost unchanged, and we test whether it holds on a newer and smaller generation of models. Using the original default bitsandbytes 8-bit and 4-bit configurations and metric definitions, we evaluate five current small instruction-tuned models (Qwen2.5-1.5B, Qwen2.5-3B, Llama-3.2-3B, Gemma-2-2B, and Phi-3.5-mini) on ARC-Challenge, MMLU, and five-option CommonsenseQA, and we add the widely used NF4 4-bit configuration as an extension. The core result reproduces. Flips are substantial, at 12 to 21 percent on 4-bit MMLU, and 4-bit quantization produces more flips than 8-bit in all 15 model-benchmark conditions. The direction of the flips also reproduces once the base rates of a multiple-choice task are taken into account. Incorrect answers change more often than correct ones in every condition, and changed incorrect answers land on the correct option far more often than chance, with a recovery rate on 4-bit MMLU of 47.5 percent against one third by chance and 43 to 60 percent in the original. The original margin explanation is supported, since correct answers with a small gap between the top two options change far more often than those with a large gap, although on these confident models many flips still come from large-margin answers. The claim that does not hold is accuracy preservation. Under the default 4-bit configuration, these models lose up to 7.8 points of accuracy, and on ARC-Challenge every model loses more accuracy than any model in the original study. Under NF4, the flips are about a third lower and the accuracy loss is about half as large. Repeated runs give identical probabilities, so the measured flips are not run-to-run noise."

